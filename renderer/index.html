<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://assets.tcgdex.net https://raw.githubusercontent.com; style-src 'self'; script-src 'self'" />
  <title>TCG Companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="back" class="back hidden" title="Back">&larr;</button>
    <img src="../assets/icon.png" class="brand-logo" alt="" />
    <div class="brand">
      <div class="brand-title">TCG Companion</div>
      <div id="breadcrumb" class="breadcrumb"></div>
    </div>
  </header>

  <main id="view"></main>

  <footer class="footer">
    <span>Card data: <strong>TCGdex</strong></span>
    <button id="db-path" class="link" title="Show the database in the file explorer"></button>
  </footer>

  <div id="modal" class="modal hidden">
    <img id="modal-img" alt="" />
  </div>

  <script src="app.js"></script>
</body>
</html>
